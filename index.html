<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Sito</title><meta name="description" content=""><link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<script src="data.js"></script>
<style>
/* LAYOUT "mare": hero a tutto schermo, menù su fondo scuro. Pesce, pizzerie storiche, locali a tema. */
:root{--primary:#16233b;--primary-2:#0f1829;--accent:#b88a3b;--accent-2:#e7c98e;--soft:#e9eef3;--cream:#f6f1e7;--paper:#fbf8f2;--ink:#1b2230;--muted:#5d6675;--line:#e3dccd;--r:18px}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--paper)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.btn{padding:.9em 1.4em;border-radius:999px;font-size:.95rem}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{border:1.5px solid currentColor;color:inherit}
header{position:fixed;inset:0 0 auto;z-index:50;transition:background .25s,box-shadow .25s}
header.solid{background:color-mix(in srgb,var(--primary) 96%,transparent);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.nav{display:flex;align-items:center;justify-content:space-between;height:76px;color:#fff}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.brand img{width:52px;height:52px;object-fit:contain}
.brand b{font-family:Fraunces,serif;font-size:1.25rem;font-weight:600;display:block}
.brand small{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;opacity:.75;font-weight:700}
nav{display:flex;gap:1.6rem;align-items:center;font-weight:600;font-size:.93rem}
nav a{text-decoration:none}
nav .btn{padding:.6em 1.1em;color:#fff}
@media (max-width:860px){nav a:not(.btn){display:none}}
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:#fff;background:var(--primary);overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,24,.55),rgba(10,14,24,.2) 35%,rgba(10,14,24,.9))}
.hero .wrap{position:relative;z-index:1;padding-bottom:clamp(48px,9vh,110px)}
.hero .eyebrow{color:var(--accent-2)}
.hero h1{font-size:clamp(2.6rem,7vw,5.4rem);max-width:14ch;margin:.35em 0 .3em}
.hero h1 em{color:var(--accent-2)}
.hero p{font-size:clamp(1.02rem,1.6vw,1.2rem);max-width:46ch;opacity:.92}
.cta{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.8rem}
.cta .btn-secondary{border-color:rgba(255,255,255,.55)}
.badges{display:flex;gap:.6rem 1.6rem;flex-wrap:wrap;margin-top:2.4rem;font-size:.88rem;font-weight:600;opacity:.9}
.badges span{display:flex;align-items:center;gap:.5em}.badges i{width:7px;height:7px;border-radius:50%;background:var(--accent-2)}
section{padding:clamp(64px,10vw,120px) 0}
.head{max-width:640px;margin-bottom:2.6rem}
.head h2{font-size:clamp(2rem,4.2vw,3.1rem);margin:.35em 0 .4em;color:var(--primary)}
.head p{color:var(--muted);font-size:1.05rem}
.pillars{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.p-item{background:var(--paper);padding:2rem 1.6rem}.p-n{font-family:Fraunces,serif;color:var(--accent);font-weight:600}
.p-item h3{font-size:1.3rem;color:var(--primary);margin:.6rem 0 .5rem}.p-item p{color:var(--muted);font-size:.95rem}
@media (max-width:900px){.pillars{grid-template-columns:1fr 1fr}}@media (max-width:520px){.pillars{grid-template-columns:1fr}}
.story{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(32px,6vw,80px);align-items:center}
.ph{position:relative}.ph img:first-child{border-radius:var(--r);aspect-ratio:4/5;object-fit:cover;width:100%}
.stamp{position:absolute;right:-18px;bottom:-18px;width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.25))}
.story h2{font-size:clamp(2rem,4vw,3rem);color:var(--primary);margin:.35em 0 .6em}
.story p{color:var(--muted);margin-bottom:1em}
.story ul{margin-top:1.4rem;display:grid;gap:.7rem}
.story li{display:flex;gap:.8rem;font-weight:600}.story li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-size:.75rem}
@media (max-width:860px){.story{grid-template-columns:1fr}.stamp{right:10px;width:96px;height:96px}}
.gallery{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:210px;gap:12px}
.g-item{overflow:hidden;border-radius:14px}.g-item img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.g-item:hover img{transform:scale(1.04)}
.g-1{grid-column:span 4;grid-row:span 2}.g-2,.g-3{grid-column:span 2}.g-4,.g-5,.g-6{grid-column:span 3;grid-row:span 2}
@media (max-width:760px){.gallery{grid-template-columns:1fr 1fr;grid-auto-rows:150px}.g-1,.g-4,.g-5,.g-6{grid-column:span 2;grid-row:span 2}.g-2,.g-3{grid-column:span 1}}
#menu{background:var(--primary);color:#fff}
#menu .head h2{color:#fff}#menu .head p{color:rgba(255,255,255,.7)}
.menu-bar{position:sticky;top:76px;z-index:10;background:var(--primary);padding:.8rem 0;margin-bottom:2rem;border-bottom:1px solid rgba(255,255,255,.1)}
.menu-tabs button{font-weight:600;font-size:.88rem;padding:.5em 1em;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:none;color:#fff}
.menu-tabs button[aria-selected=true]{background:var(--accent-2);border-color:var(--accent-2);color:var(--primary)}
.menu-pick{font-weight:700;padding:.7em 1em;border-radius:12px;border:0;background:var(--accent-2);color:var(--primary)}
.menu-search{border-radius:12px;color:#fff}.menu-search input{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.06)}
.m-cat{margin-bottom:3rem}
.m-cat-h{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;border-bottom:1px solid color-mix(in srgb,var(--accent-2) 40%,transparent);padding-bottom:.6rem;margin-bottom:1.1rem}
.m-cat-h h3{font-size:1.9rem;color:var(--accent-2)}.m-cat-h small{color:rgba(255,255,255,.55);font-size:.85rem;text-align:right}
.m-items{display:grid;grid-template-columns:1fr 1fr;gap:.2rem 3rem}@media (max-width:760px){.m-items{grid-template-columns:1fr}}
.m-item{padding:.7rem 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.m-dots{border-bottom:1px dotted rgba(255,255,255,.25);transform:translateY(-4px)}
.m-price{color:var(--accent-2)}.m-tag{background:var(--accent-2);color:var(--primary)}
.notes{margin-top:1rem;padding:1.4rem 1.6rem;border-radius:var(--r);background:rgba(255,255,255,.05);color:rgba(255,255,255,.72);font-size:.9rem;display:grid;gap:.5rem}
.notes a{color:var(--accent-2);font-weight:700}
#dove{background:var(--cream)}
.info{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(28px,5vw,60px)}
.cards{display:grid;gap:14px;align-content:start}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.5rem 1.6rem}
.card h3{font-size:1.25rem;color:var(--primary);margin:.5rem 0 .7rem}.card p{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}.actions .btn{padding:.7em 1.1em;font-size:.88rem}
.actions .btn-primary{background:var(--primary)}.actions .btn-secondary{color:var(--primary)}
.map{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);min-height:420px}
@media (max-width:860px){.info{grid-template-columns:1fr}}
footer{background:var(--primary-2);color:rgba(255,255,255,.7);padding:56px 0;font-size:.92rem}
.foot{display:flex;justify-content:space-between;gap:2rem;flex-wrap:wrap}
.foot strong{color:#fff}.social{margin-top:1rem}.social a{background:rgba(255,255,255,.08)}
.legal{margin-top:2rem;padding-top:1.2rem;border-top:1px solid rgba(255,255,255,.1);font-size:.8rem;color:rgba(255,255,255,.45)}
.callbar .btn-secondary{background:var(--primary);color:#fff;border:0}
</style>
</head>
<body>
<header data-solid data-sticky><div class="wrap nav">
  <a class="brand" href="#top"><img data-s="logo" alt=""><span><b data-s="shortName"></b><small data-s="tagline"></small></span></a>
  <nav data-s="nav"></nav>
</div></header>
<section class="hero" id="top"><img data-s="hero-img" fetchpriority="high">
  <div class="wrap"><span class="eyebrow" data-s="hero-eyebrow"></span><h1 data-s="hero-title"></h1><p data-s="hero-lead"></p>
  <div class="cta" data-s="hero-cta"></div><div class="badges" data-s="hero-badges"></div></div>
</section>
<section data-section="pillars"><div class="wrap"><div class="pillars reveal" data-s="pillars"></div></div></section>
<section id="storia" data-section="story" style="padding-top:0"><div class="wrap story">
  <div class="ph reveal"><img data-s="story-img" loading="lazy"><img class="stamp" data-s="story-stamp" alt=""></div>
  <div class="reveal"><span class="eyebrow" data-s="story-eyebrow"></span><h2 data-s="story-title"></h2><div data-s="story-body"></div><ul data-s="story-bullets"></ul></div>
</div></section>
<section id="galleria" data-section="gallery" style="padding-top:0"><div class="wrap">
  <div class="head reveal"><span class="eyebrow" data-s="gallery-eyebrow"></span><h2 data-s="gallery-title"></h2><p data-s="gallery-lead"></p></div>
  <div class="gallery reveal" data-s="gallery" data-max="5"></div>
</div></section>
<section id="menu" data-section="menu">
  <div class="wrap"><div class="head reveal"><span class="eyebrow" data-s="menu-eyebrow"></span><h2 data-s="menu-title"></h2><p data-s="menu-lead"></p></div></div>
  <div class="menu-bar" data-sticky><div class="wrap menu-ctl"><div class="menu-tabs" role="tablist" data-s="menu-tabs"></div><select class="menu-pick" data-s="menu-pick" aria-label="Categoria"></select><label class="menu-search" data-s="menu-search"></label></div></div>
  <div class="wrap"><div data-s="menu-list" data-style="list"></div><p data-s="menu-empty">Nessun piatto trovato.</p><div class="notes" data-s="menu-notes"></div></div>
</section>
<section id="dove"><div class="wrap">
  <div class="head reveal"><span class="eyebrow">Dove siamo</span><h2 data-s="addressShort"></h2><p data-s="addressLead"></p></div>
  <div class="info">
    <div class="cards">
      <div class="card reveal" data-section="hours"><span class="status" data-s="status"></span><h3>Orari</h3><table class="hours" data-s="hours"></table><p data-s="hours-note"></p></div>
      <div class="card reveal"><h3>Contatti</h3><p data-s="contacts"></p><div class="actions" data-s="contact-actions"></div></div>
    </div>
    <div class="map reveal"><iframe data-s="map"></iframe></div>
  </div>
</div></section>
<footer><div class="wrap">
  <div class="foot"><div><a class="brand" href="#top" style="color:#fff"><img data-s="logo" alt=""><span><b data-s="shortName"></b><small data-s="tagline"></small></span></a><div class="social" data-s="social"></div></div><p data-s="footer-contacts"></p></div>
  <div class="legal" data-s="legal"></div>
</div></footer>
<div class="callbar" data-s="callbar"></div>
<script src="core.js"></script>
</body>
</html>
